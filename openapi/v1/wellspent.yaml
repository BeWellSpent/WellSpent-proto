          description: Matching profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetProfileListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /rest/v1/budgets/{id}:
    get:
      operationId: getBudgetProfile
      tags: [budgets]
      summary: A single budget profile.
      description: Any active member may read it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not a member of this budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No budget profile with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateBudgetProfile
      tags: [budgets]
      summary: Rename a budget or change its cycle.
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
