            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listBudgetProfiles
      tags: [budgets]
      summary: Budgets the caller owns or is an active member of.
      security:
        - bearerAuth: []
      responses:
