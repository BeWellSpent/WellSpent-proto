            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /rest/v1/budget-periods/{id}/income-entries:
    get:
      operationId: listIncomeEntries
      tags: [budgets]
      summary: Every income entry recorded for a period.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matching entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeEntryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not a member of this period's budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /rest/v1/budget-periods/{id}/income-entries/{entryId}:
    put:
      operationId: updateIncomeEntry
      tags: [budgets]
      summary: Edit an income entry's amount for this period.
      description: Admin or collaborator, and the period must not be archived — checked in that order, so a non-collaborator on an archived period still sees the archived error.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIncomeEntryRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeEntryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The period is archived, or the caller is not a collaborator or admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /rest/v1/categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: Global system categories plus the caller's own.
      description: When budgetProfileId is given, also includes categories referenced by that budget's transactions/fixed expenses, so a collaborator can see categories the owner created. No membership check on budgetProfileId.
      security:
        - bearerAuth: []
      parameters:
        - name: budgetProfileId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matching categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category owned by the caller.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /rest/v1/categories/{id}:
    put:
      operationId: updateCategory
      tags: [categories]
      summary: Rename a category or change its color.
      description: On a system category, only color is applied (name is ignored). On a user category, the caller must own it — another user's category returns 404, not 403, since ownership is enforced entirely by the row simply not matching.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No category with this id owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a user-owned category, reassigning its transactions and fixed expenses first.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: replacementId
          in: query
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The category is a system category, not owned by the caller, or the replacement category isn't accessible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /rest/v1/payment-methods:
    post:
      operationId: createPaymentMethod
      tags: [payment-methods]
      summary: Create a payment method attributed to a budget person.
      description: |
        No membership check against the person's budget — only that
        budgetPersonId is non-zero. This mirrors a real gap in the Go
        backend, carried over rather than silently closed in this port;
        flagged here rather than left to be rediscovered.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentMethodRequest'
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodResponse'
        '400':
          description: budgetPersonId was 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /rest/v1/payment-methods/{id}:
    put:
      operationId: updatePaymentMethod
      tags: [payment-methods]
      summary: Rename a payment method, change its color, or set/clear its alias.
      description: If the method is attributed to a budget person, the caller must be a collaborator or admin on that person's budget; otherwise the caller must be the method's own creator.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentMethodRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller may not modify this payment method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deletePaymentMethod
      tags: [payment-methods]
      summary: Delete a payment method, reassigning its transactions, savings sources, and fixed expenses first.
      description: |
        The caller must be a collaborator or admin on budgetProfileId. Note
        the final deactivation step is not itself scoped to that profile in
        the underlying implementation — only the reassignment is. Mirrors a
        real gap in the Go backend, flagged rather than silently carried.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: replacementId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: budgetProfileId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not a collaborator or admin on budgetProfileId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: id or replacementId doesn't exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /rest/v1/budgets/{id}/payment-methods:
    get:
      operationId: listPaymentMethods
      tags: [payment-methods]
      summary: Every active payment method for anyone on a budget.
      description: No membership check — mirrors Go, which only requires an authenticated caller.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Matching methods.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /rest/v1/transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: Transactions for a budget period, newest date first.
      description: focusedView restricts to the caller's own person (by payment method attribution) plus unattributed transactions.
      security:
        - bearerAuth: []
      parameters:
        - name: budgetPeriodId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: transactionType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ExpenseType'
        - name: focusedView
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Matching transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not a member of this period's budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Record a spend, saving, or fixed expense.
      description: Admin or collaborator on the period's budget. A Variable transaction dated before the period's own start is rejected; Fixed is exempt.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: A Variable transaction's date falls before the period's start.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The period is archived, or the caller is not a collaborator or admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /rest/v1/transactions/{id}:
    put:
      operationId: updateTransaction
      tags: [transactions]
      summary: Edit a transaction.
      description: A full edit, except once the period has archived or the transaction is Plaid-imported — then only categoryId may actually change, and every other field must be resubmitted exactly as it already is.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: A field other than categoryId changed on an archived-period or Plaid-imported transaction, or a Variable transaction's date falls before the period's start.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not a collaborator or admin on this transaction's budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction.
      description: Admin or collaborator. Plaid-imported transactions cannot be deleted.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deleted.
        '400':
          description: The transaction is Plaid-imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The period is archived, or the caller is not a collaborator or admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /rest/v1/transactions/{id}/mark-paid:
    post:
      operationId: markTransactionAsPaid
      tags: [transactions]
      summary: Confirm payment for a fixed transaction.
      description: Admin or collaborator. If the budget has auto_update_planned_amount on, the linked FixedExpense template is also brought up to date with what actually happened.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkTransactionAsPaidRequest'
      responses:
        '200':
          description: Marked paid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The period is archived, or the caller is not a collaborator or admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /rest/v1/transactions/{id}/unmark-paid:
    post:
      operationId: unmarkTransactionAsPaid
      tags: [transactions]
      summary: Revert a transaction back to unpaid.
      description: Admin or collaborator. Resets the amount back to the planned amount. Also undoes any confirmed review that was matched against this transaction.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetPeriodIdRequest'
      responses:
        '200':
          description: Unmarked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The period is archived, or the caller is not a collaborator or admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /rest/v1/transactions/{id}/excluded:
    put:
      operationId: setTransactionExcluded
      tags: [transactions]
      summary: Toggle whether a transaction counts toward totals, without deleting it.
      description: Admin or collaborator.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTransactionExcludedRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The period is archived, or the caller is not a collaborator or admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
