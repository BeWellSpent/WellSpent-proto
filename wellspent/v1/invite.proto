syntax = "proto3";

package wellspent.v1;

import "google/protobuf/timestamp.proto";
import "wellspent/v1/common.proto";

option go_package = "github.com/BeWellSpent/wellspent-backend/gen/wellspent/v1;wellspentv1";

// InviteService's RPCs (SendBudgetInvite, ListBudgetInvites,
// CancelBudgetInvite, GetBudgetInvite, AcceptBudgetInvite) are all retired —
// every one now lives on the REST transport under /rest/v1/budgets/*/invites
// and /rest/v1/invites/*. Nothing implements this service over Connect
// anymore. BudgetInvite/InviteStatus below stay: still generated for iOS's
// (and a future Android's) domain model.

message BudgetInvite {
  string id = 1;
  string budget_profile_id = 2;
  string budget_name = 3; // denormalized for display on the invite page
  string inviter_name = 4; // denormalized for display on the invite page
  string email = 5; // recipient email address
  BudgetRole role = 6;
  InviteStatus status = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp created_at = 9;
  int64 budget_person_id = 10; // non-zero when linked to an existing placeholder person
}

enum InviteStatus {
  INVITE_STATUS_UNSPECIFIED = 0;
  INVITE_STATUS_PENDING = 1;
  INVITE_STATUS_ACCEPTED = 2;
  INVITE_STATUS_CANCELLED = 3;
  INVITE_STATUS_EXPIRED = 4;
}
