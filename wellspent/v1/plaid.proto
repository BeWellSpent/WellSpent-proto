syntax = "proto3";

package wellspent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/BeWellSpent/wellspent-backend/gen/wellspent/v1;wellspentv1";

service PlaidService {
  rpc CreateLinkToken(CreateLinkTokenRequest) returns (CreateLinkTokenResponse);
  rpc ExchangePublicToken(ExchangePublicTokenRequest) returns (ExchangePublicTokenResponse);
  rpc GetPlaidConnections(GetPlaidConnectionsRequest) returns (GetPlaidConnectionsResponse);
  rpc DisconnectPlaid(DisconnectPlaidRequest) returns (DisconnectPlaidResponse);
  // Refreshes the account list for an existing connection — call after a
  // Link "update mode" session (e.g. account selection) completes, since
  // update mode doesn't return a public_token to exchange.
  rpc RefreshPlaidAccounts(RefreshPlaidAccountsRequest) returns (RefreshPlaidAccountsResponse);
  // Clears a connection's sync cursor so the next sync replays the item's
  // full transaction history, then starts that sync immediately.
  rpc ResyncPlaidConnection(ResyncPlaidConnectionRequest) returns (ResyncPlaidConnectionResponse);
}

// ─── Shared message ───────────────────────────────────────────────────────────

message PlaidConnection {
  string id = 1;
  string institution_id = 2;
  string institution_name = 3;
  // active | disconnected | error
  string status = 4;
  google.protobuf.Timestamp last_synced_at = 5;
  string budget_profile_id = 6;
  // Display name of the budget member who linked this connection. Populated
  // when listing a budget's connections, where several members' banks appear
  // side by side and the status is meaningless without knowing whose it is.
  string owner_name = 7;
  // True when the caller linked this connection. Only the owner may
  // disconnect it, manage its accounts, or resync it — everyone else on the
  // budget sees it read-only.
  bool is_owner = 8;
  // False when the sync job skips this connection on every run because its
  // owner isn't on a paid plan. Distinct from `status`, which reports the
  // health of the link itself: an unentitled connection is perfectly healthy
  // and still imports nothing.
  bool sync_enabled = 9;
  // When the owner may next request a manual resync. Unset when one is
  // allowed right now.
  google.protobuf.Timestamp resync_available_at = 10;
}

// ─── CreateLinkToken ──────────────────────────────────────────────────────────

message CreateLinkTokenRequest {
  // Budget profile that imported transactions will be written to.
  string budget_profile_id = 1;
  // Optional. If set, requests a Link token in "update mode" with account
  // selection enabled for this existing connection (add/remove accounts on
  // an already-connected item) instead of a fresh connect flow.
  string connection_id = 2;
  // Optional. Must be a Plaid-dashboard-registered redirect URI. Only
  // needed by native clients (e.g. iOS) so OAuth-based institutions can
  // hand control back to the app; web's Link flow doesn't need one since
  // OAuth stays within the same browser tab. Omit to preserve existing
  // (non-OAuth-redirect) behavior.
  string redirect_uri = 3;
}

message CreateLinkTokenResponse {
  string link_token = 1;
  // ISO 8601 expiration time of the link token.
  string expiration = 2;
}

// ─── ExchangePublicToken ──────────────────────────────────────────────────────

message ExchangePublicTokenRequest {
  string public_token = 1;
  string budget_profile_id = 2;
}

message ExchangePublicTokenResponse {
  PlaidConnection connection = 1;
}

// ─── GetPlaidConnections ──────────────────────────────────────────────────────

message GetPlaidConnectionsRequest {
  // Optional. If set, filters to connections for a specific budget profile.
  string budget_profile_id = 1;
}

message GetPlaidConnectionsResponse {
  repeated PlaidConnection connections = 1;
  // Budgets the caller belongs to that have connections which will never
  // sync, because the member who linked them isn't on a paid plan. Empty
  // when nothing is affected.
  repeated BudgetSyncWarning warnings = 2;
}

// BudgetSyncWarning reports that some connections on a shared budget are
// being skipped by the sync job.
//
// Plaid sync is entitled per connection owner, not per budget, so a free-tier
// member of a paid budget can link a bank that is then silently never synced.
// This is deliberately an aggregate rather than the affected connections
// themselves: other members have no business seeing which institutions
// someone banks with, and nothing here is actionable by anyone but the
// member who owns them.
message BudgetSyncWarning {
  string budget_profile_id = 1;
  string budget_name = 2;
  // Display name of the member whose connections are being skipped.
  string member_name = 3;
  // How many of that member's connections are affected.
  int32 connection_count = 4;
  // True when the member is the caller, so clients can say "your bank"
  // rather than naming them, and offer an upgrade path.
  bool is_current_user = 5;
}

// ─── DisconnectPlaid ──────────────────────────────────────────────────────────

message DisconnectPlaidRequest {
  // UUID of the plaid_item row.
  string connection_id = 1;
}

message DisconnectPlaidResponse {}

// ─── RefreshPlaidAccounts ──────────────────────────────────────────────────────

message RefreshPlaidAccountsRequest {
  // UUID of the plaid_item row.
  string connection_id = 1;
}

message RefreshPlaidAccountsResponse {
  PlaidConnection connection = 1;
}

// ─── ResyncPlaidConnection ────────────────────────────────────────────────────

message ResyncPlaidConnectionRequest {
  // UUID of the plaid_item row. The caller must own it.
  string connection_id = 1;
}

message ResyncPlaidConnectionResponse {
  PlaidConnection connection = 1;
}
