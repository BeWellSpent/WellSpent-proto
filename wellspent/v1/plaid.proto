syntax = "proto3";

package wellspent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/BeWellSpent/wellspent-backend/gen/wellspent/v1;wellspentv1";

// PlaidService's RPCs (CreateLinkToken, ExchangePublicToken,
// GetPlaidConnections, DisconnectPlaid, RefreshPlaidAccounts,
// ResyncPlaidConnection) are all retired — every one now lives on the REST
// transport under /rest/v1/plaid/*. Nothing implements this service over
// Connect anymore. PlaidConnection/BudgetSyncWarning below stay: still
// generated for iOS's (and a future Android's) domain model.

message PlaidConnection {
  string id = 1;
  string institution_id = 2;
  string institution_name = 3;
  // active | disconnected | error
  string status = 4;
  google.protobuf.Timestamp last_synced_at = 5;
  string budget_profile_id = 6;
  // Display name of the budget member who linked this connection. Populated
  // when listing a budget's connections, where several members' banks appear
  // side by side and the status is meaningless without knowing whose it is.
  string owner_name = 7;
  // True when the caller linked this connection. Only the owner may
  // disconnect it, manage its accounts, or resync it — everyone else on the
  // budget sees it read-only.
  bool is_owner = 8;
  // False when the sync job skips this connection on every run because its
  // owner isn't on a paid plan. Distinct from `status`, which reports the
  // health of the link itself: an unentitled connection is perfectly healthy
  // and still imports nothing.
  bool sync_enabled = 9;
  // When the owner may next request a manual resync. Unset when one is
  // allowed right now.
  google.protobuf.Timestamp resync_available_at = 10;
}

// BudgetSyncWarning reports that some connections on a shared budget are
// being skipped by the sync job.
//
// Plaid sync is entitled per connection owner, not per budget, so a free-tier
// member of a paid budget can link a bank that is then silently never synced.
// This is deliberately an aggregate rather than the affected connections
// themselves: other members have no business seeing which institutions
// someone banks with, and nothing here is actionable by anyone but the
// member who owns them.
message BudgetSyncWarning {
  string budget_profile_id = 1;
  string budget_name = 2;
  // Display name of the member whose connections are being skipped.
  string member_name = 3;
  // How many of that member's connections are affected.
  int32 connection_count = 4;
  // True when the member is the caller, so clients can say "your bank"
  // rather than naming them, and offer an upgrade path.
  bool is_current_user = 5;
}
