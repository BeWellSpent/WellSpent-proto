syntax = "proto3";

package wellspent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/BeWellSpent/wellspent-backend/gen/wellspent/v1;wellspentv1";

// NotificationService's RPCs (ListNotifications, MarkNotificationsRead,
// GetUnreadCount, ListAlertSubscriptions, UpsertAlertSubscription,
// DeleteAlertSubscription, RegisterDeviceToken) are all retired — every one
// now lives on the REST transport under /rest/v1/notifications/* and
// /rest/v1/alert-subscriptions/*. Nothing implements this service over
// Connect anymore. Notification/AlertSubscription below stay: still
// generated for iOS's (and a future Android's) domain model.

message Notification {
  string id = 1;
  string user_id = 2;
  string budget_profile_id = 3;
  // alert_type matches AlertSubscription.alert_type values
  string alert_type = 4;
  string title = 5;
  string body = 6;
  bool is_read = 7;
  google.protobuf.Timestamp created_at = 8;
}

// AlertSubscription defines when and how a user is notified about budget events.
//
// alert_type values:
//   "spending_threshold" — fires when spending crosses threshold_pct% of the plan
//   "new_transaction"    — fires when another member adds a transaction
//   "review_pending"     — fires when a Plaid import is queued for review
//   "period_created"     — fires when a new budget period starts
//
// channel values: "email", "in_app", "both"
// threshold_scope values: "budget" (total), "category" (per category_id)
message AlertSubscription {
  string id = 1;
  string user_id = 2;
  string budget_profile_id = 3;
  string alert_type = 4;
  string channel = 5;
  // 0–100; only meaningful when alert_type = "spending_threshold"
  float threshold_pct = 6;
  // "budget" or "category"; only for spending_threshold
  string threshold_scope = 7;
  // Only set when threshold_scope = "category"
  int32 category_id = 8;
  // When true, the notification is fanned out to all active budget members
  bool notify_all_members = 9;
  google.protobuf.Timestamp created_at = 10;
}
